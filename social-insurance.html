// ===== DOM 引用 =====
var provSel = document.getElementById('siProvince');
var salaryInp = document.getElementById('siSalary');
var fundEnabled = document.getElementById('siFundEnabled');
var fundRatioSel = document.getElementById('siFundRatio');
var fundHint = document.getElementById('siFundHint');
var medicalAidCheck = document.getElementById('siMedicalAid');
var industrySel = document.getElementById('siIndustry');
var longTermCheck = document.getElementById('siLongTermCare');
var resetBtn = document.getElementById('siReset');
var baseInfo = document.getElementById('siBaseInfo');
var baseText = document.getElementById('siBaseText');
var resultDiv = document.getElementById('siResult');
var resultCard = document.getElementById('resultCard');

// ===== 初始化省份下拉 =====
var provinces = Object.keys(PROVINCE_BASES).sort();
provSel.innerHTML = '<option value="">请选择省份/直辖市</option><option value="安徽" selected>安徽</option>';
provinces.forEach(function(p) {
  if (p === '安徽') return;
  provSel.innerHTML += '<option value="' + p + '">' + p + '</option>';
});

// ===== 获取当前有效费率 =====
function getRates() {
  var prov = provSel.value;
  var bases = PROVINCE_BASES[prov];
  if (!bases) return null;

  var rates = JSON.parse(JSON.stringify(PROVINCE_RATES[prov] || {}));
  if (!rates.pension) return null;

  rates.province = prov;
  rates.siMin = bases.min;
  rates.siMax = bases.max;
  rates.fundMin = bases.fundMin;
  rates.fundMax = bases.fundMax;

  rates.injury = parseFloat(industrySel.value);
  rates.longTermCare = longTermCheck.checked ? 0.15 : 0;
  rates.fundEnabled = fundEnabled.checked;
  var fundRatio = parseInt(fundRatioSel.value);
  if (rates.fundMaxRatio && fundRatio > rates.fundMaxRatio) fundRatio = rates.fundMaxRatio;
  rates.fundRatio = fundRatio;
  rates.medicalAidFixed = medicalAidCheck.checked ? 12 : 0;

  return rates;
}

// ===== 计算 =====
function calcSI(rates, salary) {
  var siBase = Math.max(rates.siMin, Math.min(salary, rates.siMax));
  var fundBase = Math.max(rates.fundMin, Math.min(salary, rates.fundMax));

  var isCapped = salary < rates.siMin ? 'floor' : (salary > rates.siMax ? 'ceiling' : 'normal');
  var isFundCapped = salary < rates.fundMin ? 'floor' : (salary > rates.fundMax ? 'ceiling' : 'normal');

  var pensionEmp = round2(siBase * rates.pension[0] / 100);
  var pensionPer = round2(siBase * rates.pension[1] / 100);

  var medicalEmp = round2(siBase * rates.medical[0] / 100);
  var medicalPer = round2(siBase * rates.medical[1] / 100);
  var maternityEmp = rates.maternityEmployer ? round2(siBase * rates.maternityEmployer / 100) : 0;
  var medicalFixedPer = rates.medicalFixed || 0;

  var unempEmp = round2(siBase * rates.unemployment[0] / 100);
  var unempPer = round2(siBase * rates.unemployment[1] / 100);

  var injuryEmp = round2(siBase * rates.injury / 100);

  var ltcEmp = rates.longTermCare ? round2(siBase * rates.longTermCare / 100) : 0;
  var ltcPer = rates.longTermCare ? round2(siBase * rates.longTermCare / 100) : 0;

  var medicalAidEmp = rates.medicalAidFixed || 0;
  var medicalAidPer = 0;

  var fundEmp = 0, fundPer = 0;
  if (rates.fundEnabled) {
    fundEmp = round2(fundBase * rates.fundRatio / 100);
    fundPer = round2(fundBase * rates.fundRatio / 100);
  }

  var siEmpTotal = round2(pensionEmp + medicalEmp + maternityEmp + medicalAidEmp + unempEmp + injuryEmp + ltcEmp);
  var siPerTotal = round2(pensionPer + medicalPer + medicalFixedPer + medicalAidPer + unempPer + ltcPer);
  var grandEmpTotal = round2(siEmpTotal + fundEmp);
  var grandPerTotal = round2(siPerTotal + fundPer);
  var takeHome = round2(salary - grandPerTotal);
  var companyCost = round2(salary + grandEmpTotal);

  return {
    rates: rates, salary: salary,
    siBase: siBase, fundBase: fundBase,
    isCapped: isCapped, isFundCapped: isFundCapped,
    pensionEmp: pensionEmp, pensionPer: pensionPer,
    medicalEmp: medicalEmp, medicalPer: medicalPer,
    maternityEmp: maternityEmp,
    medicalFixedPer: medicalFixedPer,
    unempEmp: unempEmp, unempPer: unempPer,
    injuryEmp: injuryEmp,
    ltcEmp: ltcEmp, ltcPer: ltcPer,
    medicalAidEmp: medicalAidEmp,
    fundEmp: fundEmp, fundPer: fundPer,
    siEmpTotal: siEmpTotal, siPerTotal: siPerTotal,
    grandEmpTotal: grandEmpTotal, grandPerTotal: grandPerTotal,
    takeHome: takeHome, companyCost: companyCost
  };
}

// ===== 渲染结果 =====
function renderResult(r) {
  var rates = r.rates;
  var hasLTC = rates.longTermCare > 0;
  var hasMaternity = rates.maternityEmployer > 0;

  var medicalLabel = hasMaternity ? '医疗保险（基本）' : '医疗保险（含生育）';

  var rows = '';
  rows += buildRow('养老保险', rates.pension[0]+'%', r.pensionEmp, rates.pension[1]+'%', r.pensionPer);
  rows += buildRow(medicalLabel, rates.medical[0]+'%', r.medicalEmp, rates.medical[1]+'%' + (r.medicalFixedPer ? '+' + r.medicalFixedPer + '元' : ''), r.medicalPer);
  if (hasMaternity) {
    rows += buildRow('生育保险', rates.maternityEmployer+'%', r.maternityEmp, '—', 0);
  }
  rows += buildRow('失业保险', rates.unemployment[0]+'%', r.unempEmp, rates.unemployment[1]+'%', r.unempPer);
  if (r.medicalAidEmp > 0) {
    rows += buildRow('大病医疗救助', '12元/月·人', r.medicalAidEmp, '—', 0);
  }
  rows += buildRow('工伤保险', rates.injury+'%', r.injuryEmp, '—', 0);
  if (hasLTC) {
    rows += buildRow('长期护理险', rates.longTermCare+'%', r.ltcEmp, rates.longTermCare+'%', r.ltcPer);
  }
  // 社保合计
  rows += '<tr class="si-row--total"><td><strong>社保合计</strong></td>' +
    '<td>—</td><td><strong>¥' + toLocale(r.siEmpTotal) + '</strong></td>' +
    '<td>—</td><td><strong>¥' + toLocale(r.siPerTotal) + '</strong></td>' +
    '<td><strong>¥' + toLocale(r.siEmpTotal + r.siPerTotal) + '</strong></td></tr>';
  if (rates.fundEnabled) {
    rows += buildRow('住房公积金', rates.fundRatio+'%', r.fundEmp, rates.fundRatio+'%', r.fundPer);
    rows += '<tr class="si-row--grand"><td><strong>五险一金总计</strong></td>' +
      '<td>—</td><td><strong>¥' + toLocale(r.grandEmpTotal) + '</strong></td>' +
      '<td>—</td><td><strong>¥' + toLocale(r.grandPerTotal) + '</strong></td>' +
      '<td><strong>¥' + toLocale(r.grandEmpTotal + r.grandPerTotal) + '</strong></td></tr>';
  }

  // 底部备注
  var isMunicipality = ['北京', '上海', '天津', '重庆'].indexOf(rates.province) >= 0;
  var scopeNote = rates.province === '安徽'
    ? '测算口径：安徽合肥、六安地区按实测口径计算'
    : '测算口径：按' + rates.province + (isMunicipality ? '市' : '省级') + '常见企业职工参数估算，未区分具体城市或统筹区，不作为申报、结算依据';
  var notes = [scopeNote];
  if (rates.medicalNote) notes.push(rates.medicalNote);
  if (rates.fundEnabled) notes.push('公积金比例' + rates.fundRatio + '%');
  else notes.push('📝 未缴纳公积金');
  var notesHtml = '<div class="result-notes">' + notes.join('；') + '</div>';

  var html = '<div class="table-wrap">' +
    '<table class="table"><thead><tr>' +
    '<th>险种</th><th>单位比例</th><th>单位月缴</th><th>个人比例</th><th>个人月缴</th><th>合计</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' + notesHtml +
    '<div class="summary-grid">' +
    '<div class="summary-card"><div class="summary-card__label">💰 员工实收（未扣个税）</div>' +
    '<div class="summary-card__amount">¥' + toLocale(r.takeHome) + '</div>' +
    '<div class="summary-card__sub">税前 ' + toLocale(r.salary) + ' − 个人 ' + toLocale(r.grandPerTotal) + '</div></div>' +
    '<div class="summary-card"><div class="summary-card__label">🏢 企业月用工成本（参考）</div>' +
    '<div class="summary-card__amount">¥' + toLocale(r.companyCost) + '</div>' +
    '<div class="summary-card__sub">工资 ' + toLocale(r.salary) + ' + 单位 ' + toLocale(r.grandEmpTotal) + '</div></div>' +
    '<div class="summary-card summary-card--highlight"><div class="summary-card__label">📊 企业支出 / 员工实收（参考）</div>' +
    '<div class="summary-card__amount">' + round2(r.companyCost / r.salary).toFixed(2) + '</div>' +
    '<div class="summary-card__sub">企业每支出1元，个人实收约' + round2(r.takeHome / r.companyCost).toFixed(2) + '元</div></div>' +
    '</div>';

  // 基数信息
  var capClass = (r.isCapped !== 'normal') ? ' base-tag--capped' : '';
  var capLabel = r.isCapped === 'floor' ? '按下限' : (r.isCapped === 'ceiling' ? '按上限' : '按实际');
  baseText.innerHTML = '<strong>缴费基数 ¥' + toLocale(r.siBase) + '</strong>（' + capLabel + '）' +
    '<span class="base-tag' + capClass + '" style="margin-left:6px">范围 ¥' + toLocale(rates.siMin) + ' ~ ¥' + toLocale(rates.siMax) + '</span>';
  baseInfo.style.display = 'flex';

  if (rates.province === '上海') {
    fundRatioSel.querySelectorAll('option').forEach(function(opt) {
      opt.disabled = parseInt(opt.value) > 7;
    });
  } else {
    fundRatioSel.querySelectorAll('option').forEach(function(opt) {
      opt.disabled = false;
    });
  }

  resultCard.style.display = 'block';
  resultDiv.innerHTML = html;
}

function buildRow(label, empRate, empAmt, perRate, perAmt) {
  var total = empAmt + perAmt;
  return '<tr>' +
    '<td>' + label + '</td>' +
    '<td>' + empRate + '</td>' +
    '<td>¥' + toLocale(empAmt) + '</td>' +
    '<td>' + perRate + '</td>' +
    '<td>' + (perAmt === 0 ? '<span class="si-cell--na">不缴</span>' : '¥' + toLocale(perAmt)) + '</td>' +
    '<td><strong>¥' + toLocale(total) + '</strong></td>' +
    '</tr>';
}

// ===== 联动计算 =====
var debounceTimer = null;
function runCalc() {
  var rates = getRates();
  if (!rates) {
    baseInfo.style.display = 'none';
    resultCard.style.display = 'none';
    return;
  }
  var salary = parseFloat(salaryInp.value.replace(/,/g, '')) || 0;
  if (salary <= 0) {
    baseInfo.style.display = 'none';
    resultCard.style.display = 'none';
    return;
  }
  var r = calcSI(rates, salary);
  renderResult(r);
}

// ===== 重置 =====
function resetAll() {
  provSel.value = '';
  salaryInp.value = '';
  fundEnabled.checked = false;
  fundRatioSel.value = '8';
  fundHint.style.display = 'none';
  medicalAidCheck.checked = false;
  industrySel.value = '0.2';
  longTermCheck.checked = false;
  baseInfo.style.display = 'none';
  resultCard.style.display = 'none';
  resultDiv.innerHTML = '<div class="result-placeholder">请在上方选择省份并填写缴费工资，自动计算</div>';
  resultCard.style.display = 'block';
}

// ===== 事件绑定 =====
provSel.addEventListener('change', runCalc);
salaryInp.addEventListener('focus', function() {
  this.value = (this.value || '').replace(/,/g, '');
});
salaryInp.addEventListener('blur', function() {
  var v = parseFloat(this.value.replace(/,/g, ''));
  if (!isNaN(v)) this.value = toLocale(v);
  runCalc();
});
salaryInp.addEventListener('input', function() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runCalc, 300);
});
fundEnabled.addEventListener('change', function() {
  fundHint.style.display = this.checked ? 'block' : 'none';
  runCalc();
});
fundRatioSel.addEventListener('change', runCalc);
medicalAidCheck.addEventListener('change', runCalc);
industrySel.addEventListener('change', runCalc);
longTermCheck.addEventListener('change', runCalc);
resetBtn.addEventListener('click', resetAll);

// ===== 初始运行 =====
runCalc();

})();
